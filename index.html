<!DOCTYPE html><html><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumble Unblocker Beta</title>
  <link href="../fonts.googleapis.com/css2/family=Courier+Prime&amp;display=swap.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Courier Prime', monospace;
      background: #1e1e1e url('../i.imgur.com/iaPmMZu.jpeg');
      background-size: cover;
      background-attachment: fixed;
      color: #0f0;
      min-height: 100vh;
    padding: 20px;
      margin: 0;
    }

    .wrapper {
      max-width: 650px;
      margin: 50px auto;
      background: rgba(32,32,32,0.95);
    padding: 35px;
      border-radius: 12px;
      box-shadow: 0 0 50px #000;
    }

    h1 {
      font-size: 30px;
      color: #fc0;
      text-align: center;
    margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(255,204,0,0.8);
    }

    .logo {
      width: 80px;
      display: block;
    margin: 0 auto 15px;
      border-radius: 50%;
      box-shadow: 0 0 10px #fc0;
    }

    #fs-btn {
      display: block;
      width: 100%;
      max-width: 250px;
      margin: 0 auto 20px;
      padding: 12px;
    font-size: 17px;
      background: #fc0;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(255,204,0,0.5);
    }
    #fs-btn:hover {
      background: #f90;
    }

    iframe {
      width: 100%;
      height: 420px;
      border: 2px solid #fc0;
    border-radius: 6px;
      background: #000;
      box-shadow: 0 0 20px rgba(255,204,0,0.5);
    }

    .url-box {
    margin-top: 25px;
      display: flex;
      gap: 10px;
    }
    
    #url {
      flex: 1;
      font-size: 17px;
      padding: 12px;
      background: #333;
    color: #fc0;
      border: 2px solid #fc0;
      border-radius: 4px;
    }
    #url:focus {
      border-color: #f90;
      outline: none;
    }

    #go-btn {
      font-size: 17px;
    padding: 12px 25px;
      border: none;
      border-radius: 4px;
      background: #fc0;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255,204,0,0.5);
      font-weight: bold;
    }
    #go-btn:hover {
      background: #f90;
    }

    #msg {
      margin-top: 20px;
      text-align: center;
    font-size: 17px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .url-box {
        flex-direction: column;
      }
      #go-btn {
      width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Welcome To Bumble Unblocker Beta</h1>
    <img src="../avatars.githubusercontent.com/u/179241802/v=4" class="logo" alt="logo">
    <button id="fs-btn">Full Screen Website</button>
    <iframe id="frame"></iframe>
    <div class="url-box">
      <input type="text" id="url" placeholder="Enter A URL" autofocus="">
      <button id="go-btn" onclick="load()">Unblock</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var msg = document.getElementById('msg');
    
    function load() {
      var u = document.getElementById('url').value.trim();
      console.log('loading:', u);
      
      if (u == '') {
        msg.textContent = 'Please Enter A Valid URL';
        msg.style.color = 'red';
        return;
      }

      msg.textContent = 'Getting Bumble Bees To Unblock Website...';
      msg.style.color = '#888';

      var link = 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u);
      
      fetch(link)
        .then(function(r) {
          if (r.ok) {
            return r.text();
          }
          throw new Error('Failed (' + r.status + ')');
        })
        .then(function(stuff) {
          console.log('got the page');
          var d = frame.contentDocument || frame.contentWindow.document;
          d.open();
          d.write(stuff);
          d.close();
          
          // i hope this base tag works
          var base = d.createElement('base');
          base.href = u;
          d.head.appendChild(base);
          
          msg.textContent = 'Unblocked Successfully';
          msg.style.color = 'green';
          console.log('worked!');
        })
        .catch(function(err) {
          console.error(err);
          msg.textContent = 'Failed To Unblock Website Please Try Again';
          msg.style.color = 'red'
        });
    }

    document.getElementById('fs-btn').onclick = function() {
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else {
        alert('Fullscreen not supported')
      }
    };
  </script>


</body></html>
