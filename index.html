    :root {

    .container {

    @media (max-width: 768px) {

    .input-row { display: flex; gap: 10px; align-items: flex-start; }
    
    textarea#prompt {
      flex: 1; min-width: 0; max-height: 250px; height: 56px; resize: vertical;

      transition: all 0.2s ease;
    }
    
    textarea#prompt:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
    }

    .generate-btn {
      background: var(--accent-color);
      border: none; border-radius: 6px; padding: 12px 22px;
      font-size: 15px; font-weight: 500; cursor: pointer; color: #000; min-height: 56px;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .2s ease;
      box-shadow: 0 2px 10px rgba(0, 217, 255, 0.2);
    }
    
    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.3);
    }
    
    .generate-btn[disabled] { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
    
    .options-row { display: flex; justify-content: space-between; align-items: center; }
    .left-group, .right-group { display: flex; gap: 8px; align-items: center; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(10, 15, 20, 0.85);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 20px; z-index: 2000;
    }
    
    .modal {
      width: 100%; max-width: 720px; background: #0D131A;
      border-radius: 8px; padding: 24px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.8);
      color: var(--text-color); border: 1px solid var(--border-color);
    }

    @media (max-width: 420px) {
      .modal { padding: 18px; max-width: calc(100% - 12px); border-radius: 6px; }
    }

    .styles-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 16px;
    }
    
    .style-card {
      background: var(--surface-color); border-radius: 6px; overflow: hidden;
      cursor: pointer; text-align: center; border: 2px solid transparent;
      padding-bottom: 10px; font-size: 13px; transition: all 0.2s ease;
    }
    
    .style-card:hover { transform: scale(1.05); }
    .style-card img { width: 100%; height: 72px; object-fit: cover; display: block; margin-bottom: 8px; }
    .style-card.selected { border-color: var(--accent-color); box-shadow: 0 0 20px rgba(0, 217, 255, 0.25); }

    .settings-row { display: flex; gap: 14px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

    .modal-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
    .modal-actions button { 
      background: var(--surface-color); border-radius: 6px; padding: 9px 14px;

      flex-wrap: wrap; justify-content: center; align-items: flex-start;
      padding: 16px; border-radius: 8px;
      background: rgba(16, 24, 32, 0.5); border: 1px solid var(--border-color);

    .image-card {
      background: #000; border-radius: 8px; padding: 8px;
      min-height: 120px; width: min(350px, 90vw);
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;

    .image-card img { width: 100%; height: auto; display: block; border-radius: 6px; }
    .loader { border: 3px solid #333; border-top: 3px solid var(--accent-color); border-radius: 50%; width: 22px; height: 22px; animation: spin 1s linear infinite; }
    @keyframes spin { 0%{ transform: rotate(0deg) } 100%{ transform: rotate(360deg) } }
    
    .muted { color: var(--muted-color); font-size: 13px; font-family: var(--font-secondary); }

    #feedbackPopup {

    #feedbackPopup.show { right: 20px; }

    .rating-stars { display: flex; gap: 8px; margin-bottom: 15px; }
    .rating-stars .fa-star { font-size: 24px; color: #333; cursor: pointer; transition: color 0.2s; }
    .rating-stars .fa-star.filled { color: var(--accent-color); }
    #feedbackMessage {
      width: 100%; height: 80px; background: var(--bg-color);
      border: 1px solid var(--border-color); color: var(--text-color);
      padding: 10px; border-radius: 6px; resize: vertical;

    }
    #feedbackActions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    #feedbackActions button {
      background: var(--surface-color); border-radius: 6px; padding: 8px 14px;
      font-size: 14px; color: var(--text-color); border: 1px solid var(--border-color); cursor: pointer;
    }
    #feedbackActions #submitFeedbackBtn { background: var(--accent-color); border: none; color: #000; font-weight: 500; }
  </style>
</head>
<body>

<script>
  const baseUrl = 'https://image.pollinations.ai';
  let selectedStyle = 'none';
  let isGenerating = false;
  let generationCount = 0;
  let selectedRating = 0;

  const styleTemplates = {
    cinema: " Shot in native IMAX 65mm and ARRI ALEXA LF with anamorphic lenses, color graded in HDR10/Dolby Vision, dynamic lighting",
    realistic: " real life intricate footage scene captured photo",
    photography: " hyperrealistic professional ultra intricately detailed photography",
    fantasy: " epic fantasy, vibrant colors, surreal composition"
  };

  // DOM Elements
  const styleBtn = document.getElementById('styleBtn');
  const styleModal = document.getElementById('styleModal');
  const closeStyle = document.getElementById('closeStyle');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsModal = document.getElementById('settingsModal');
  const closeSettings = document.getElementById('closeSettings');
  const saveSettings = document.getElementById('saveSettings');
  const generateBtn = document.getElementById('generateBtn');
  const promptInput = document.getElementById('prompt');
  const imagesContainer = document.getElementById('images');
  const styleCards = document.querySelectorAll('.style-card');

  // Modal Handlers
  styleBtn.onclick = () => { styleModal.style.display = 'flex'; };
  closeStyle.onclick = () => { styleModal.style.display = 'none'; };
  settingsBtn.onclick = () => { settingsModal.style.display = 'flex'; };
  closeSettings.onclick = () => { settingsModal.style.display = 'none'; };
  saveSettings.onclick = () => { settingsModal.style.display = 'none'; };

  // Style Selection
  styleCards.forEach(card => {
    card.onclick = () => {
      styleCards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedStyle = card.dataset.name;
    };
  });

  // Image Generation Handler
  generateBtn.onclick = async () => {
    const rawPrompt = promptInput.value.trim();
    if (!rawPrompt || isGenerating) return;

    isGenerating = true;
    generateBtn.disabled = true;
    
    // Create card element with loader
    const card = document.createElement('div');
    card.className = 'image-card';
    card.innerHTML = '<div class="loader"></div>';
    imagesContainer.prepend(card);

    let finalPrompt = rawPrompt;
    if (selectedStyle !== 'none' && styleTemplates[selectedStyle]) {
      finalPrompt += styleTemplates[selectedStyle];
    }

    const model = document.getElementById('model').value;
    const width = document.getElementById('width').value;
    const height = document.getElementById('height').value;
    const enhance = document.getElementById('enhance').checked;
    const isRandom = document.getElementById('randomSeed').checked;
    const seed = isRandom ? Math.floor(Math.random() * 100000) : document.getElementById('seed').value;

    const encodedPrompt = encodeURIComponent(finalPrompt);
    const imageUrl = `${baseUrl}/prompt/${encodedPrompt}?model=${model}&width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=${enhance}`;

    const img = new Image();
    img.src = imageUrl;
    img.onload = () => {
      card.innerHTML = '';
      card.appendChild(img);
      isGenerating = false;
      generateBtn.disabled = false;
    };
    img.onerror = () => {
      card.innerHTML = '<span class="muted">Failed to load image.</span>';
      isGenerating = false;
      generateBtn.disabled = false;
    };
  };
</script>
